name: PR check

on:
  pull_request:

jobs:
  check-node-version-sync:
    name: Check .nvmrc and eas.json node versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare node versions
        run: |
          NVMRC_VERSION=$(tr -d '[:space:]' < .nvmrc)
          EAS_VERSION=$(jq -r '.build.production.node' eas.json)
          if [[ "$NVMRC_VERSION" != "$EAS_VERSION" ]]; then
            echo "::error::.nvmrc ($NVMRC_VERSION) does not match eas.json build.production.node ($EAS_VERSION)"
            exit 1
          fi
          echo "Node versions match: $NVMRC_VERSION"

  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', 'patches/**', 'package.json') }}
      - name: Install dependencies
        run: yarn install

  typecheck:
    name: Run TypeScript typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', 'patches/**', 'package.json') }}
      - name: Run tsc
        run: yarn tsc

  test:
    name: Run unit tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', 'patches/**', 'package.json') }}
      - name: Run unit tests
        run: yarn jest --coverage=false --detectOpenHandles --forceExit

  detect-fingerprint:
    name: Check if dev build needed
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      needs_native_build_ios: ${{ steps.check.outputs.needs_native_build_ios }}
      needs_native_build_android: ${{ steps.check.outputs.needs_native_build_android }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', 'patches/**', 'package.json') }}
      - name: Generate fingerprints
        id: fingerprint
        env:
          APP_ENV: development
          EXPO_ROLLBAR_ACCESS_TOKEN: ${{ secrets.EXPO_ROLLBAR_ACCESS_TOKEN }}
          EXPO_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_SPOTIFY_CLIENT_ID }}
        run: |
          npx @expo/fingerprint fingerprint:generate --platform ios > fingerprint-ios.json
          npx @expo/fingerprint fingerprint:generate --platform android > fingerprint-android.json
          IOS_HASH=$(jq -r '.hash' fingerprint-ios.json)
          ANDROID_HASH=$(jq -r '.hash' fingerprint-android.json)
          echo "ios_hash=$IOS_HASH" >> $GITHUB_OUTPUT
          echo "android_hash=$ANDROID_HASH" >> $GITHUB_OUTPUT
      - name: Upload fingerprint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ github.sha }}
          path: |
            fingerprint-ios.json
            fingerprint-android.json
      - name: Check for existing builds
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          IOS_BUILDS=$(yarn eas build:list \
            --fingerprint-hash ${{ steps.fingerprint.outputs.ios_hash }} \
            --build-profile development \
            --platform ios --status finished --limit 1 \
            --json --non-interactive 2>&1 | sed -n '/^\[/,/^\]/p' | jq 'length' 2>/dev/null)
          IOS_BUILDS=${IOS_BUILDS:-0}
          ANDROID_BUILDS=$(yarn eas build:list \
            --fingerprint-hash ${{ steps.fingerprint.outputs.android_hash }} \
            --build-profile development \
            --platform android --status finished --limit 1 \
            --json --non-interactive 2>&1 | sed -n '/^\[/,/^\]/p' | jq 'length' 2>/dev/null)
          ANDROID_BUILDS=${ANDROID_BUILDS:-0}
          if [[ "$IOS_BUILDS" -eq 0 ]]; then
            echo "needs_native_build_ios=true" >> $GITHUB_OUTPUT
          else
            echo "needs_native_build_ios=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$ANDROID_BUILDS" -eq 0 ]]; then
            echo "needs_native_build_android=true" >> $GITHUB_OUTPUT
          else
            echo "needs_native_build_android=false" >> $GITHUB_OUTPUT
          fi

  label-pr:
    name: Sync native build label
    needs: detect-fingerprint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Sync native build label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_NATIVE: ${{ needs.detect-fingerprint.outputs.needs_native_build_ios == 'true' || needs.detect-fingerprint.outputs.needs_native_build_android == 'true' }}
        run: |
          if [[ "$NEEDS_NATIVE" == "true" ]]; then
            gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "native build"
          else
            gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label "native build" || true
          fi

  deploy-preview:
    name: Deploy preview update
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', 'patches/**', 'package.json') }}
      - name: Capture deploy-time fingerprints
        env:
          APP_ENV: development
          EXPO_ROLLBAR_ACCESS_TOKEN: ${{ secrets.EXPO_ROLLBAR_ACCESS_TOKEN }}
          EXPO_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_SPOTIFY_CLIENT_ID }}
        run: |
          npx @expo/fingerprint fingerprint:generate --platform ios > fingerprint-ios-deploy.json
          npx @expo/fingerprint fingerprint:generate --platform android > fingerprint-android-deploy.json
      - name: Upload deploy-time fingerprint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-deploy-${{ github.sha }}
          path: |
            fingerprint-ios-deploy.json
            fingerprint-android-deploy.json
      - name: Deploy EAS update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: development
          EXPO_ROLLBAR_ACCESS_TOKEN: ${{ secrets.EXPO_ROLLBAR_ACCESS_TOKEN }}
          EXPO_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_SPOTIFY_CLIENT_ID }}
        run: yarn eas update --branch ${{ github.head_ref }} --message "${{ github.event.pull_request.title }}" --non-interactive
